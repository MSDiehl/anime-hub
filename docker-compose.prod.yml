services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-animehub}
      POSTGRES_USER: ${POSTGRES_USER:-animehub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-animehub} -d ${POSTGRES_DB:-animehub}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend/AnimeHub.Api/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB:-animehub};Username=${POSTGRES_USER:-animehub};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      ConnectionStrings__Redis: redis:6379
      ExternalApis__AniList__BaseUrl: https://graphql.anilist.co
      Cors__AllowedOrigins__0: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required}
      AccountEmail__ApiBaseUrl: ${API_PUBLIC_ORIGIN:?API_PUBLIC_ORIGIN is required}
      AccountEmail__PublicBaseUrl: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required}
      AccountEmail__FromEmail: ${ACCOUNT_EMAIL_FROM:-}
      AccountEmail__Smtp__Host: ${SMTP_HOST:-}
      AccountEmail__Smtp__Port: ${SMTP_PORT:-587}
      AccountEmail__Smtp__EnableSsl: ${SMTP_ENABLE_SSL:-true}
      AccountEmail__Smtp__UserName: ${SMTP_USERNAME:-}
      AccountEmail__Smtp__Password: ${SMTP_PASSWORD:-}
      SeedData__Enabled: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: frontend/animehub-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_started

volumes:
  postgres-data:
